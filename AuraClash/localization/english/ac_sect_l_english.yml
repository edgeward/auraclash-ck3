 ac_sect_window_member_merit:0 "[Character.Custom('AC_SectRank')] | Merit: [Character.MakeScope.Var('ac_sect_merit').GetValue|0]"
 activity_ac_sect_trials_conclusion_desc:0 "The examiners have recorded each completed trial. Successful applicants enter the lineage, and qualified candidates advance while places remain."
 activity_ac_sect_trials_guest_desc:0 "Attend the sect's public examinations."
 activity_ac_sect_trials_host_desc:0 "Open a public examination as Sect Master, using the sect treasury."
 activity_ac_sect_joint_training_conclusion_desc:0 "The cultivators return home with the lessons of their allied lineages."
 activity_ac_sect_joint_training_guest_desc:0 "Train with your sect's allies."
 activity_ac_sect_joint_training_host_desc:0 "Open your estate to allied disciples."
 ac_sect.0002.desc:0 "My interest in joining a cultivation sect is recorded. I will hear when a nearby Sect Master opens a public trial, and can then decide whether to travel to the headquarters.\n\nThe masters choose when to hold their trials. Registering does not begin an activity or guarantee admission. Mortals and cultivators alike must pass the three examinations and compete for the available Lower Disciple places."
 ac_sect.0002.withdraw:0 "Withdraw my interest for now."
 ac_sect_trial.0020.t:0 "A Sect Master Opens the Gates"
 ac_sect_trial.0020.desc:0 "[ac_announced_master.GetShortUIName] has announced a public trial for the [ac_announced_kingdom.GetNameNoTier] Sect at [ac_announced_headquarters.GetName].\n\nThe examinations test understanding, martial form, and spiritual control. I may review the invitation and arrange my journey before the trial begins. Admission requires a score of 40 and a free Lower Disciple place; a requested promotion requires 55 points, 150 contribution, and an Upper Disciple vacancy."
 ac_sect_trial.0020.review:0 "Review the master's invitation."
 ac_sect_trial.0020.wait:0 "Let this trial pass."
 ac_sect_trial_master_host_tt:0 "The Sect Master hosts public trials."
 ac_sect_trial_ready_tt:0 "The sect has an available Master, a place for recruitment or requested promotion, and no pending activity or trial cooldown."
 ac_sect_trial_funds_tt:0 "The sect treasury has at least 50 gold to fund the examinations."
 ac_sect_headquarters_location_tt:0 "This is the sect's permanent headquarters."
 ac_sect_trial.0100.t:0 "Sect Trial Preparations"

 ac_sect_hud_estate_tt:0 "#T Sect Domicile#!\nOpen the estate at [GetPlayer.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_headquarters').Province.GetName]. The ring tracks its current construction project."
 ac_sect_hud_contracts_tt:0 "#T Sect Contracts#!\nReview assignments posted by your Sect Master and your active contract."
 ac_sect_contract_board_help:0 "Review an assignment to open its contract letter, inspect the employer, destination, difficulty and rewards, then arrange travel. Resolve the job at its destination to earn contribution and Sect Merit. Only one contract may be undertaken at a time."
 ac_sect_contract_cooldown:0 "#warning You are resting from your last assignment. Check a contract letter for availability.#!"
