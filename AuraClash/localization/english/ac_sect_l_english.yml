 trait_ac_sect_upper_disciple:0 "Upper Disciple"
 trait_ac_sect_upper_disciple_desc:0 "An experienced cultivator who earned advancement through service and examination."
 trait_ac_sect_lower_disciple:0 "Lower Disciple"
 trait_ac_sect_lower_disciple_desc:0 "A cultivator admitted into a sect's martial lineage."
 ac_sect_society:0 "Cultivation Sect"
 ac_sect_society_desc:0 "A provincial society of cultivators, united by a martial lineage."
 ac_sect_roster:0 "Disciples and Master"
 ac_sect_kingdom:0 "Founding Kingdom"
 ac_sect_upper_label:0 "Upper Disciples"
 ac_sect_lower_label:0 "Lower Disciples"
 ac_sect_story_summary:0 "Headquarters: [Story.MakeScope.Var('ac_headquarters').Province.GetName]. Treasury: [Story.MakeScope.Var('ac_treasury').GetValue|0] gold."
 ac_sect_ledger_decision:0 "Consult the Sect Register"
 ac_sect_ledger_decision_desc:0 "Record my interest in joining a cultivation sect and receive news of public trials. Sect members can consult their estate, missions, contribution exchange, and relations."
 ac_sect_ledger_decision_tooltip:0 "Open the cultivation sect register"
 ac_sect_ledger_decision_confirm:0 "Open the register"
 ac_sect_request_promotion_decision:0 "Request an Upper Disciple Trial"
 ac_sect_request_promotion_decision_desc:0 "Ask to sit the next sect examination. Admission costs 150 contribution when the trial begins. A score of 55 and an open Upper Disciple place are required."
 ac_sect_request_promotion_decision_tooltip:0 "Register for a promotion examination"
 ac_sect_request_promotion_decision_confirm:0 "Register my name"
 ac_sect_promotion_requested_tt:0 "Your request is recorded. Attend the next trial opened by your Sect Master. The 150 contribution fee is collected when your examination starts. Interrupted trials and a full Upper Disciple roster refund the fee. Failed completed examinations consume it."
 ac_sect_use_pill_decision:0 "Take a Cultivation Pill"
 ac_sect_use_pill_decision_desc:0 "Use one medicinal pill from the sect exchange to support my cultivation and recovery."
 ac_sect_use_pill_decision_tooltip:0 "Consume a stored medicinal pill"
 ac_sect_use_pill_decision_confirm:0 "Begin the treatment"
 ac_sect_close:0 "Close the register."
 ac_sect_back:0 "Return to the register."
 ac_sect.0001.t:0 "The Sect Register"
 ac_sect.0001.desc:0 "#bold [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_kingdom').Title.GetNameNoTier] Sect#!\n[ROOT.Char.Custom('AC_SectIdentity')]\n\nMaster: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_master').Char.GetShortUIName]\nEstate: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_headquarters').Province.GetName]\nUpper Disciples: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_upper_count').GetValue|0]/10\nLower Disciples: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_lower_count').GetValue|0]/20\n\nMy contribution: #P [ROOT.Char.MakeScope.Var('ac_sect_contribution').GetValue|0]#!\nLifetime merit: [ROOT.Char.MakeScope.Var('ac_sect_merit').GetValue|0]\nSect treasury: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_treasury').GetValue|0] gold."
 ac_sect.0001.estate:0 "Open the sect domicile."
 ac_sect.0001.missions:0 "Read the mission board."
 ac_sect.0001.exchange:0 "Visit the contribution exchange."
 ac_sect.0001.diplomacy:0 "Consult the register of neighboring sects."
 ac_sect.0001.promotion:0 "Request an Upper Disciple examination."
 ac_sect.0001.donate:0 "Donate 100 gold to the estate."
 ac_sect.0001.leave:0 "Consider leaving the sect."
 ac_sect_donation_tt:0 "The gold enters the sect treasury. Donations do not grant contribution or lifetime merit."
 ac_sect.0002.t:0 "Interest in Cultivation Sects"
 ac_sect.0002.found:0 "The sect of [ROOT.Char.MakeScope.Var('ac_sect_application').Var('ac_kingdom').Title.GetNameNoTier] trains at [ROOT.Char.MakeScope.Var('ac_sect_application').Var('ac_headquarters').Province.GetName]. Its master, [ROOT.Char.MakeScope.Var('ac_sect_application').Var('ac_master').Char.GetShortUIName], admits both mortals and cultivators through public trials.\n\nComplete the three examinations with a score of at least 40 while a Lower Disciple place is open."
 ac_sect.0002.none:0 "No sect within reach has yet been recorded. Consult the register again after the sects have been established."
 ac_sect.0002.apply:0 "Keep my name on the register."
 ac_sect.0002.another:0 "Look for another sect within reach."
 ac_sect_application_tt:0 "You will receive news when a nearby Sect Master opens a public trial. You can review the invitation and arrange your journey through the Activities screen. The master chooses when to host; registering interest does not begin a trial or charge a hosting fee."
 ac_sect.0003.t:0 "A Neighboring Sect"
 ac_sect.0003.desc:0 "The [ROOT.Char.MakeScope.Var('ac_viewed_sect').Var('ac_kingdom').Title.GetNameNoTier] Sect is led by [ROOT.Char.MakeScope.Var('ac_viewed_sect').Var('ac_master').Char.GetShortUIName] from [ROOT.Char.MakeScope.Var('ac_viewed_sect').Var('ac_headquarters').Province.GetName].\n\nSect alliances permit joint training and support in group battles. Declaring rivalry ends any alliance between the two sects. These ties endure through changes of master."
 ac_sect.0003.next:0 "Consult another entry."
 ac_sect.0010.t:0 "The Contribution Exchange"
 ac_sect.0010.desc:0 "My available contribution is [ROOT.Char.MakeScope.Var('ac_sect_contribution').GetValue|0]. Spending it leaves my lifetime merit intact. The sect's buildings determine which resources can be supplied."
 ac_sect.0010.pill:0 "A medicinal pill: 50 contribution."
 ac_sect.0010.manual:0 "Study a martial manual: 75 contribution."
 ac_sect.0010.gold:0 "A stipend of 40 gold: 50 contribution."
 ac_sect_pill_tt:0 "Gain one stored medicinal pill. Use the Take a Cultivation Pill decision to relieve 30 stress, gain 5 Fortitude Core experience, and gain a small health benefit for six months."
 ac_sect.0011.t:0 "Leave the Martial Lineage?"
 ac_sect.0011.desc:0 "Leaving forfeits my unspent contribution, lifetime standing, and unfinished mission. My cultivation and purchased resources remain mine. I must wait one year before applying to another sect."
 ac_sect.0011.leave:0 "I will follow my own path."
 ac_sect.0020.t:0 "The Master's Seat"
 ac_sect.0020.desc:0 "I take responsibility for the sect. Its provincial estate, completed buildings, construction projects, treasury, disciples, and relationships pass into my care. My secular titles and government remain my own."
 ac_sect.0020.accept:0 "I will uphold our lineage."
 ac_sect.0030.t:0 "The Banners Withdraw"
 ac_sect.0030.desc:0 "The [ac_victorious_sect.Var('ac_kingdom').Title.GetNameNoTier] Sect has prevailed over the [ac_defeated_sect.Var('ac_kingdom').Title.GetNameNoTier] Sect.\n\nThe victors receive up to 75 gold from the defeated treasury, and their participating disciples earn 15 contribution. The wounded return to their estates. Both sects must recover for two years before another battle."
 ac_sect.0030.accept:0 "Record the outcome."
 ac_sect_estate.0001.t:0 "The Sect Estate"
 ac_sect_estate.0001.desc:0 "At [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_headquarters').Province.GetName], the sect's buildings serve the whole lineage. They remain here when the master dies or secular rulers change.\n\nTreasury: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_treasury').GetValue|0] gold.\nCultivation Hall: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_cultivation_hall').GetValue|0]/3\nAlchemy Pavilion: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_alchemy_pavilion').GetValue|0]/3\nTraining Ground: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_training_ground').GetValue|0]/3\nScripture Library: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_scripture_library').GetValue|0]/3\nSpirit Garden: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_spirit_garden').GetValue|0]/3\nFormation Hall: [ROOT.Char.MakeScope.Var('ac_sect').Story.MakeScope.Var('ac_formation_hall').GetValue|0]/3\n\nThe master commissions one project at a time. Each level costs 100 more gold than the previous level and takes six to seven months."
 ac_sect_construction_complete:0 "Sect Estate Construction Complete"
 ac_sect_headquarters_modifier:0 "Cultivation Sect Headquarters"
 ac_sect_headquarters_modifier_desc:0 "A cultivation sect maintains a permanent estate in this province."
 ac_sect_joint_training_modifier:0 "Joint Sect Training"
 ac_sect_joint_training_modifier_desc:0 "Training with an allied lineage has sharpened this cultivator's coordination and technique."
 ac_sect_medicinal_pill_modifier:0 "Cultivation Medicine"
 ac_sect_medicinal_pill_modifier_desc:0 "A carefully prepared medicinal pill supports this cultivator's recovery."
 ac_sect_mission.0001.t:0 "The Mission Board"
 ac_sect_mission.0001.desc:0 "Sect service earns contribution and lifetime merit. Choose one assignment, complete its objective, and return with a report. Accepting a contract opens its journey planner; the encounter takes place at its destination. Each completed or abandoned assignment is followed by a 90-day rest. An unfinished mission must be resolved before another can be accepted."
 ac_sect_mission.0002.t:0 "A Sect Mission: The Decisive Moment"
 ac_sect_mission.0002.desc:0 "I have reached the location of my assignment. A sound plan and the right cultivation technique may secure the result our sect needs."
 ac_sect_mission.0002.perform:0 "Complete the task with care."
 ac_sect_mission.0002.expertise:0 "Apply my particular expertise."
 ac_sect_mission.0002.cultivation:0 "Use the cultivation technique best suited to this task."
 ac_sect_mission.0002.abandon:0 "Withdraw and report the failure."
 ac_sect_trial.0001.t:0 "The Examination of Understanding"
 ac_sect_trial.0001.desc:0 "The examiners present a passage from the sect's scriptures. I must explain its teaching and how it would guide my conduct. Learning and diligence provide the foundation of my answer."
 ac_sect_trial.0001.study:0 "Work patiently through every line."
 ac_sect_trial.0001.insight:0 "Reveal the principle beneath the words."
 ac_sect_trial.0001.rest:0 "Offer a modest answer and conserve my strength."
 ac_sect_trial.0002.t:0 "The Examination of Form"
 ac_sect_trial.0002.desc:0 "In the training ground, the examiners judge balance, control, and discipline. Prowess matters, but the point is mastery of oneself."
 ac_sect_trial.0002.form:0 "Repeat the form until every movement is precise."
 ac_sect_trial.0002.mastery:0 "Demonstrate the technique I have mastered."
 ac_sect_trial.0002.safe:0 "Keep my movements simple and controlled."
 ac_sect_trial.0003.t:0 "A New Disciple"
 ac_sect_trial.0003.desc:0 "My name is entered into the sect's register as a Lower Disciple. The masters guide my awakened cultivation into the lineage's teachings. My existing foundation and martial style, if any, remain my own."
 ac_sect_trial.0004.t:0 "The Upper Hall"
 ac_sect_trial.0004.desc:0 "Service and examination have earned me the standing of Upper Disciple. I am entrusted with the sect's second element and a place among those who may one day succeed its master."
 ac_sect_trial.0005.t:0 "More Remains to Learn"
 ac_sect_trial.0005.desc:0 "The examiners cannot grant the place I sought. My performance or the available places have fallen short. I may prepare for another trial in a year."
 ac_sect_trial.accept:0 "I accept the responsibilities of this path."
 ac_sect_trial.again:0 "I will return better prepared."
 ac_sect_trial.0010.t:0 "Two Lineages, One Training Ground"
 ac_sect_trial.0010.desc:0 "Our allies bring forms unfamiliar to our own disciples. We practice the transitions between them and learn where our elements can support one another. The full benefit requires at least one allied disciple to remain through the activity."
 ac_sect_trial.0010.observe:0 "Observe their discipline closely."
 ac_sect_trial.0010.teach:0 "Share a principle from our own lineage."
 activity_ac_sect_trials:0 "Sect Trial"
 activity_ac_sect_trials_host_an_a:0 "a"
 activity_ac_sect_trials_name:0 "[ACTIVITY.GetHost.GetShortUINamePossessive|U] Sect Trial"
 activity_ac_sect_trials_desc:0 "The Sect Master opens examinations in understanding, martial form, and spiritual control. Interested mortals and cultivators may earn admission; Lower Disciples may spend contribution to seek promotion."
 activity_ac_sect_trials_owner:0 "Host"
 activity_ac_sect_trials_destination_selection:0 "All three examinations take place at the sect's permanent headquarters. Select that headquarters once."
 activity_ac_sect_trials_selection_tooltip:0 "Examine new applicants and candidates for Upper Disciple."
 activity_ac_sect_trials_guest_help_text:0 "Complete all three examinations. Admission requires 40 points; promotion requires 55 points and 150 contribution. Places are limited."
 activity_ac_sect_trials_predicted_cost:0 "The sect treasury pays 50 gold when its master opens the trial. Applicants pay no hosting fee."
 activity_ac_sect_trials_province_desc:0 "The sect's permanent headquarters."
 TRAVEL_NAME_FOR_activity_ac_sect_trials:0 "Journey to the Sect Trial"
 activity_ac_sect_joint_training:0 "Joint Sect Training"
 activity_ac_sect_joint_training_host_an_a:0 "a"
 activity_ac_sect_joint_training_name:0 "[ACTIVITY.GetHost.GetShortUINamePossessive|U] Joint Sect Training"
 activity_ac_sect_joint_training_desc:0 "Train alongside an allied sect. Disciples exchange techniques, practice formations, and earn contribution."
 activity_ac_sect_joint_training_owner:0 "Host"
 activity_ac_sect_joint_training_destination_selection:0 "Joint training takes place at your sect's headquarters."
 activity_ac_sect_joint_training_selection_tooltip:0 "Invite allied cultivators to train at your estate."
 activity_ac_sect_joint_training_guest_help_text:0 "Complete training alongside at least one allied disciple to earn 30 contribution, cultivation experience, and improved prowess."
 activity_ac_sect_joint_training_predicted_cost:0 "Hosting joint training costs 75 gold."
 activity_ac_sect_joint_training_province_desc:0 "The host sect's training grounds."
 TRAVEL_NAME_FOR_activity_ac_sect_joint_training:0 "Journey to Joint Sect Training"
 ac_sect_theory_phase:0 "Understanding"
 ac_sect_theory_phase_desc:0 "Study and interpret the sect's teachings."
 ac_sect_body_phase:0 "Martial Form"
 ac_sect_body_phase_desc:0 "Demonstrate disciplined movement and technique."
 ac_sect_spirit_phase:0 "Spiritual Control"
 ac_sect_spirit_phase_desc:0 "Unite body and understanding, then receive the examiners' judgment."
 ac_sect_joint_forms_phase:0 "Exchange of Forms"
 ac_sect_joint_forms_phase_desc:0 "Learn how allied techniques complement your own."
 ac_sect_joint_formation_phase:0 "Combined Formations"
 ac_sect_joint_formation_phase_desc:0 "Practice coordinated combat across the two lineages."
 ac_sect_study_intent:0 "Study Cultivation"
 ac_sect_study_intent_desc:0 "Improve your command of the sect's teachings."
 ac_sect_invite_members:0 "Sect Disciples"
 ac_sect_invite_members_desc:0 "Invite the master and disciples of the host sect."
 ac_sect_invite_allies:0 "Allied Sects"
 ac_sect_invite_allies_desc:0 "Invite cultivators belonging to allied sects."
 ac_sect_invite_candidates:0 "Local Applicants"
 ac_sect_invite_candidates_desc:0 "Invite adult mortals and unaffiliated cultivators from the court near the headquarters."
 ac_sect_apply_interaction:0 "Express Interest in This Sect"
 ac_sect_apply_interaction_desc:0 "Tell this Sect Master that you wish to attempt the sect's next public trial. The master decides when to open it."
 ac_sect_offer_alliance_interaction:0 "Offer a Sect Alliance"
 ac_sect_offer_alliance_interaction_desc:0 "Bind the two sects in friendship, permitting joint training and support in sect battles."
 ac_sect_end_alliance_interaction:0 "End the Sect Alliance"
 ac_sect_end_alliance_interaction_desc:0 "Withdraw your sect from its alliance with this lineage."
 ac_sect_rivalry_interaction:0 "Declare Sect Rivalry"
 ac_sect_rivalry_interaction_desc:0 "Declare this lineage a rival. Any alliance between your sects ends."
 ac_sect_battle_interaction:0 "Challenge the Rival Sect"
 ac_sect_battle_interaction_desc:0 "Muster your available cultivators for a group battle in one to two months. Prowess, estate training, and allied support determine the odds. Defeat risks injuries and the loss of up to 75 sect gold. Both sects then recover for two years."
 ac_sect_handover_interaction:0 "Entrust the Sect to This Disciple"
 ac_sect_handover_interaction_desc:0 "Yield the master's seat to this Upper Disciple and return to the Upper Disciples yourself. The estate and all sect relationships pass intact."
 ac_sect_expel_interaction:0 "Expel from the Sect"
 ac_sect_expel_interaction_desc:0 "Remove this disciple from the roster. Their contribution and standing are forfeited, but their cultivation remains."
 ac_sect_seek_leadership_decision:0 "Petition for Sect Leadership"
 ac_sect_seek_leadership_decision_desc:0 "With 400 lifetime merit, I may ask the Upper Disciples to support a peaceful transfer of leadership. The petition consumes 200 contribution and has a 60% chance of success."
 ac_sect_seek_leadership_decision_tooltip:0 "Present a petition to the sect council"
 ac_sect_seek_leadership_decision_confirm:0 "Call the council"
 ac_sect.0021.t:0 "Before the Upper Disciples"
 ac_sect.0021.desc:0 "My service has earned me the right to ask the master to step aside. The council must be persuaded that the lineage would prosper under my direction. Presenting the petition costs 200 contribution, with a 60% chance that the master accepts an honorable retirement. Another petition must wait five years."
 ac_sect.0021.petition:0 "Let my record of service speak for me."
 ac_sect_found_decision:0 "Establish a Cultivation Sect"
 ac_sect_found_decision_desc:0 "This kingdom has no cultivation sect. I can endow a permanent estate in my capital and establish a new martial lineage."
 ac_sect_found_decision_tooltip:0 "Found the kingdom's first sect"
 ac_sect_found_decision_confirm:0 "Establish the lineage"
