l_english:
 EVENT_WINDOW_OPTION_AVAILABLE_CULTIVATION:0 "This option is available because you or a present companion can use the required cultivation technique."
 ac_event_chi_exertion_modifier:0 "Spent Chi"
 ac_event_chi_exertion_modifier_desc:0 "A recent cultivation technique has left this character temporarily drained."
 ac_event_great_exertion_modifier:0 "Overextended Chi"
 ac_event_great_exertion_modifier_desc:0 "This character pushed their cultivation to its limits to avert a catastrophe."
 ac_event_restored_fields_modifier:0 "Cultivated Fields"
 ac_event_restored_fields_modifier_desc:0 "Cultivation techniques and funded relief are helping these fields recover."
 ac_event_warded_patrols_modifier:0 "Warded Patrol Posts"
 ac_event_warded_patrols_modifier_desc:0 "Patrols operate from posts protected by cultivation formations."
 ac_event_cultivator_patrols_modifier:0 "Cultivator Patrols"
 ac_event_cultivator_patrols_modifier_desc:0 "A cultivator has organized patrols to restore order without collective punishment."
 ac_event_preserved_provisions_modifier:0 "Fresh Provisions Kept on Ice"
 ac_event_preserved_provisions_modifier_desc:0 "New supplies are kept fresh by an ice cultivator."
 ac_event_poison_recovery_modifier:0 "Purging Poison"
 ac_event_poison_recovery_modifier_desc:0 "Cultivation saved this character from poisoning, but recovery will take time."
 ac_event_poison_intervention_desc:0 "A bitter taste lingers after the meal. My pulse stumbles as I climb the stairs, and [stop_host_scope.GetTitledFirstNamePossessive] expression leaves no doubt: this was deliberate.\n\nBefore the darkness can claim me, I turn my awareness inward. There is still time to force the poison from my body."
 ac_event_poison_survived_log_title:0 "Poison Purged"
 ac_event_poison_survived_log:0 "[CHARACTER.GetShortUIName|U] used cultivation to survive poisoning during a visit to [TARGET_CHARACTER.GetShortUIName]."
 ac_event_poison_survived_toast:0 "Cultivation Defeated the Poison"
 ac_event_sea_saved_tt:0 "You and your entourage survive the storm. The cultivator who shields the ship suffers severe exhaustion."
 ac_event_poison_saved_tt:0 "You survive the poisoning, expose your host's attack, and spend six months recovering."
 ac_event_heal_tt:0 "The patient recovers one wound tier. Infection and gangrene are not cured. The healer cannot use Chi Healing again for six months."
 ac_event_squall_water:0 "Let the current carry our crippled ship."
 ac_event_squall_wind:0 "A scrap of canvas is enough for my wind."
 ac_event_squall_water_tt:0 "A controlled current carries the damaged ship to safety without additional delay."
 ac_event_squall_wind_tt:0 "A steady magical wind drives an improvised rig without additional delay."
 ac_event_overboard:0 "Lift our companion clear of the waves!"
 ac_event_flood:0 "Turn the flood aside. We leave no one behind."
 ac_event_flood_tt:0 "Both your companion and the caravan supplies are saved."
 ac_event_water_source:0 "There is water beneath us. Bring the skins."
 ac_event_water_source_tt:0 "You replenish the caravan's drinking water without sacrificing a companion or suffering new dehydration."
 ac_event_brushfire:0 "The flames will not cross this line."
 ac_event_brushfire_tt:0 "You contain the brushfire, protecting the caravan from burns and delays."
 ac_event_snowbound:0 "We shall make our own passage through the snow."
 ac_event_snowbound_tt:0 "You clear a safe passage in two days without paying the guides."
 ac_event_avalanche:0 "Hold the snow steady. I can reach them!"
 ac_event_forest:0 "Let chi show us the road beyond these trees."
 ac_event_forest_tt:0 "Your cultivation reveals a route out of the forest without paying for a guide or adding a delay."
 ac_event_mountain_rescue:0 "Catch them upon the wind!"
 ac_event_bridge_mido:0 "Try stopping an Iron Body with that little blade."
 ac_event_bridge_akakiru:0 "One cut, and your weapons fall into the river."
 ac_event_bridge_storm:0 "Let thunder collect your toll."
 ac_event_bridge_darkness:0 "Our shadows will cross where your eyes cannot follow."
 ac_event_bridge_mido_tt:0 "The cultivator overpowers and wounds the bandit leader. Your party crosses without paying or risking a knight."
 ac_event_bridge_blade_tt:0 "A precise display of Akakiru disarms the bandits and clears the bridge."
 ac_event_bridge_storm_tt:0 "A thunderclap scatters the bandits. You cross without paying the toll."
 ac_event_bridge_darkness_tt:0 "You conceal the party's crossing and slip past without a fight or payment."
 ac_event_safe_forage:0 "I know which roots will feed us and which will kill us."
 ac_event_ice_supplies:0 "Buy fresh stores. I will keep these cold."
 ac_event_safe_forage_tt:0 "You replace spoiled food with safe forage, avoiding poisonous plants and illness."
 ac_event_ice_supplies_tt:0 "The spoiled food is discarded. You purchase replacements and keep them fresh with ice; this does not restore rotten food."
 ac_event_rainstorm:0 "Their chi is still close. Follow me!"
 ac_event_heal_wounds:0 "Let me mend these wounds with chi."
 ac_event_hunt_beast:0 "A cultivated stance is enough to break its charge."
 ac_event_hunt_beast_tt:0 "Your technique forces the beast to retreat. You and your companion avoid injury; the hunt continues normally."
 ac_event_hunt_defend:0 "Your blade will never reach them."
 ac_event_hunt_defend_tt:0 "You interrupt the attack and protect its intended victim. Any active scheme is exposed by the normal event follow-up."
 ac_event_restore_fields:0 "We shall restore these fields with cultivation and relief."
 ac_event_restore_fields_tt:0 "You fund a local relief project. The petitioning county gains three years of improved recovery and supply; famine and epidemics are not instantly removed."
 ac_event_warded_patrols:0 "Ward the patrol posts. Make the roads safe again."
 ac_event_martial_patrols:0 "I will lead the patrols and train their captains."
 ac_event_survive_sea_storm:0 "Gather your chi! This ship will not sink!"
 ac_event_purge_poison:0 "Force the poison out before it reaches my heart."
 ac_event_epidemic_defenses_modifier:0 "Cultivated Plague Defenses"
 ac_event_epidemic_defenses_modifier_desc:0 "Funded remedies and protective formations support the capital's plague response."
 ac_event_safe_burials_modifier:0 "Cultivated Funeral Relief"
 ac_event_safe_burials_modifier_desc:0 "A cultivator has funded safe disposal of the dead, easing pressure on the burial grounds."
 ac_event_reassured_people_modifier:0 "Prayers Answered"
 ac_event_reassured_people_modifier_desc:0 "Aoyusumu prayers and public relief have reassured frightened inhabitants."
 ac_event_meditative_retreat_modifier:0 "Within the Calming Current"
 ac_event_meditative_retreat_modifier_desc:0 "A demanding meditative retreat leaves less time for diplomatic and administrative duties."
 ac_event_disaster_cost_tt:0 "You fund supplies and organize relief. If you are still traveling, your journey is delayed three days. The contract is completed through the existing relief outcome."
 ac_event_plague_limit_tt:0 "The funded measures improve epidemic resistance in your capital county for three years. They do not remove an existing epidemic."
 ac_event_frost_control_tt:0 "You reduce frostbite severity and update its existing modifiers. Previously lost limbs are not restored."
 ac_event_contest_safe_tt:0 "Your technique prevents injury and death in this encounter, including its delayed resolution. It does not guarantee winning the tournament."
 ac_event_cultivated_contest_desc:0 "Our deadly encounter ends with a display of cultivation. Neither of us suffers a wound: the murderous exchange has been interrupted before it can claim a life.\n\nThe tournament continues around us."
 ac_event_refuge_tt:0 "You protect yourself and the family members or courtier present in this event. Only people physically here benefit."
 ac_event_ward_camp_tt:0 "Your protected rallying point shelters nearby people and you avoid the event's wound roll."
 ac_event_meditation_tt:0 "Lose 40 stress and spend six months in a demanding meditative retreat. This choice cannot be used again for three years."
 ac_event_besieged_soul_tt:0 "The event's spiritual-affliction modifier is removed. Other illnesses and permanent mental-health traits are unchanged."
 ac_event_child_healing_tt:0 "Treat the child's ordinary illness without the normal contact-infection roll. This does not cure epidemics throughout the county."
 ac_event_mending_named_tt:0 "Kiihakai's Mending Chi restores one wound tier. The six-month cooldown is shared with other Chi Healing treatments."
 ac_event_retrieve_chest_tt:0 "The artifact stays in your possession and your caravan master is not sent into danger."
 ac_event_burial_cremation_tt:0 "The remains are safely cremated. If your faith's funeral tradition does not permit cremation, you lose piety."
 ac_event_safe_antidote_tt:0 "You neutralize this snakebite, remove its ordinary illness, and avoid the event's lethal venom outcomes."
 ac_event_poison_gift_tt:0 "You send the poisoned gift through its normal response event, gaining scheme opportunities without accidentally poisoning your household."
 ac_event_wheel_tt:0 "Runes reinforce the repaired wheel. Your caravan resumes after one day, with its supplies intact."
 ac_event_artifact_repair_tt:0 "You pay for materials and restore the artifact to its maximum durability."
 ac_event_chipped_repair_tt:0 "You pay for materials, preserve your existing weapon, and recover the tournament score lost when it was chipped."
 ac_event_precognition_tt:0 "Precognition warns you before the attack. You avert it without taking a lethal combat roll."
 ac_event_rubble_relief:0 "Hold the walls steady. We will bring them all out."
 ac_event_medical_relief:0 "Set out clean beds. My chi will aid the physicians."
 ac_event_mending_relief:0 "Mending Chi will close their wounds while the physicians work."
 ac_event_food_relief:0 "Keep relief flowing while this county recovers."
 ac_event_bind_looters:0 "Bind their hands. There need be no executions."
 ac_event_subdue_looters:0 "My domain ends this looting. Put down what you have taken."
 ac_event_rebuild_farm:0 "A child should not have to lift these stones alone."
 ac_event_cultivated_prevention:0 "Fund remedies and protective formations around the capital."
 ac_event_alchemy_compendium:0 "Let us record remedies I have tested myself."
 ac_event_earth_graves:0 "Raise new burial grounds beyond the crowded streets."
 ac_event_fire_cremation:0 "I will tend the funeral pyres until the streets are clear."
 ac_event_purify_corpse:0 "Destroy the contamination before anyone touches it."
 ac_event_seal_corpse:0 "Seal the remains and keep the workers beyond the wards."
 ac_event_heal_child:0 "Bring the child here. I can offer more than a royal touch."
 ac_event_purify_dungeon_wound:0 "Even here, I can drive the corruption from this wound."
 ac_event_wind_arrow:0 "The wind will carry this arrow true."
 ac_event_contest_disarm:0 "Akakiru teaches that a drawn blade need not draw blood."
 ac_event_contest_subdue:0 "Enough. You cannot break this stance."
 ac_event_contest_shadow:0 "Your hatred strikes an empty shadow."
 ac_event_contest_precognition:0 "I have already seen where that blow will fall."
 ac_event_refine_chipped_sword:0 "Fetch materials. I shall refine the damaged edge myself."
 ac_event_scry_tunnel:0 "My Scrying Sphere will show whether that passage is still open."
 ac_event_shadow_tunnel:0 "A forgotten passage is the perfect road for a shadow."
 ac_event_refined_poison_gift:0 "I will refine the powder and seal it away from our own hands."
 ac_event_prison_captive_mido:0 "Your chains cannot hold a Wallbreaker."
 ac_event_prison_captive_shadow:0 "You caught my hand. You did not catch my shadow."
 ac_event_prison_captive_earth:0 "Then I shall make a door of the stone itself."
 ac_event_retrieve_artifact:0 "Let the wind and waves return what is ours."
 ac_event_frost_control:0 "Steady warmth, carefully guided. We can halt this frostbite."
 ac_event_snake_antidote:0 "I know how to draw this venom out."
 ac_event_subdue_travel_beast:0 "Be still, beast. There is no prey for you here."
 ac_event_thunder_travel_beast:0 "A thunderclap will send it running."
 ac_event_free_wagons:0 "Firm ground, drained ruts, and one final push."
 ac_event_plantation_fire:0 "Turn the flames aside and bring the workers out."
 ac_event_plantation_mido:0 "My Iron Body will carry them through the flames."
 ac_event_forest_fire_control:0 "Open a path through those flames!"
 ac_event_forest_fire_wind:0 "Lift our companion clear of the fire!"
 ac_event_forest_fire_barrier:0 "Stand behind my Barrier of Chi!"
 ac_event_aoyusumu_stampede:0 "Breathe with me. There is room for everyone."
 ac_event_aoyusumu_exorcism:0 "I will perform the Exorcist's Rite. Hold them gently."
 ac_event_aoyusumu_doomsday:0 "Let us hear their prayers and answer their fear."
 ac_event_aoyusumu_meditation:0 "I will find stillness within the Calming Current."
 ac_event_aoyusumu_quake_refuge:0 "Set up a refuge. I will hear each family's fears myself."
 ac_event_kiihakai_family_barrier:0 "Stay behind me—all of you!"
 ac_event_kiihakai_camp_ward:0 "Gather within the ward. We will hold here together."
 ac_event_aoyusumu_disaster_foresight:0 "I have seen the danger. Follow my retreat!"
 ac_event_kiihakai_wheel:0 "A few runes will hold the wheel until proper repairs."
 ac_event_kiihakai_artifact:0 "Renew its runes, and let it serve us faithfully again."
 ac_event_kiihakai_mend_wounds:0 "Let Kiihakai's Mending Chi close these wounds."
 ac_event_aoyusumu_hunt_precognition:0 "I saw your attack before you drew the blade."
 ac_event_aoyusumu_hunt_precognition_tt:0 "You interrupt the attack and protect its intended victim. Any active scheme is exposed by the normal event follow-up."
 ac_event_activity_technique_success:0 "Your cultivation improves your position in this contest."
 ac_event_activity_technique_failure:0 "Your opponent withstands the technique, costing you ground."
 ac_event_activity_roll_tt:0 "Your technique has an improved chance of gaining contest progress. Your skill and core training affect the roll; a cultivating opponent is harder to overcome. It does not guarantee victory."
 ac_event_activity_board_tt:0 "Foresee one strong move using a skill supported by this game. Opposing Precognition reduces the advantage. Normal counters, scoring, stakes and match resolution still apply. Usable once per day."
 ac_event_activity_pit_desc:0 "The ground gives way beneath me, and I fall into a hidden pit. Before I strike the bottom, I reach for my cultivation. There may yet be a way to land safely and escape."
 ac_event_activity_pit_tt:0 "Your technique prevents the fall injury and gets you out without another injury roll."
 ac_event_activity_wrestle_desc:0 "My opponent locks an arm around my neck and tightens the hold. The pressure builds frighteningly quickly. I must reinforce my stance and break free before something snaps."
 ac_event_activity_wrestle_safe_tt:0 "Break the dangerous headlock without the event's death or permanent-disfigurement outcomes. This does not guarantee winning the bout."
 ac_event_activity_joust_safe_tt:0 "Use Iron Body to continue this pass without the event's additional wound. This does not guarantee winning the joust."
 ac_event_activity_pilgrim_calm_tt:0 "Restore order and organize the rescue. Your companion still faces the normal risk of drowning; calming alone does not lift someone from the sea."
 ac_event_activity_repair_tt:0 "Pay for materials and restore only the durability lost in this brawl. Older damage remains."
 ac_event_activity_jockey_prepare_tt:0 "Choose this jockey through the normal selection process and gain a small preparation advantage. You must be present to assist. The jockey does not gain your cultivation."
 ac_event_activity_jockey_treat_tt:0 "Mend one wound tier on the jockey who is here. Uses the shared six-month healing cooldown."
 ac_event_activity_collision_tt:0 "Recover only the small contest-score penalty your horse suffered in this collision. The other horse's result is unchanged."
 ac_event_activity_escape_tt:0 "Escape the murder feast using the normal survivor bookkeeping. Your companions and the guest of honor still face the original outcomes."
 ac_event_activity_child_tt:0 "Teach calm breathing and ordinary archery. The child receives hunting practice, not cultivation advancement."
 ac_event_activity_board_foresight:0 "I have seen where this line of play leads."
 ac_event_activity_board_0863:0 "I have already seen the decisive sequence."
 ac_event_activity_board_5520:0 "A glimpse ahead will tell me whether this gambit holds."
 ac_event_activity_board_5530:0 "I need no hidden piece. I can see the winning line."
 ac_event_activity_contest_events_0610_aki_ranks:0 "Close ranks! We advance as one."
 ac_event_activity_contest_events_0610_mido_line:0 "Rally on me. Our line will not break."
 ac_event_activity_contest_events_0610_mido_breaker:0 "Follow me through the breach!"
 ac_event_activity_contest_events_0860_aki_pike:0 "Steady lance, perfect line. Let the charge do the work."
 ac_event_activity_contest_events_0860_mido_rider:0 "My mount and I will meet this charge together."
 ac_event_activity_contest_events_0860_mido_body:0 "Brace the Iron Body. Hold the saddle."
 ac_event_activity_contest_events_0861_mido_body:0 "An Iron Body is no easy thing to pin."
 ac_event_activity_contest_events_0861_mido_line:0 "Root my stance. Turn the hold against them."
 ac_event_activity_contest_events_0861_mido_breaker:0 "Break the pin with one explosive reversal!"
 ac_event_activity_contest_events_0862_aki_duelist:0 "One precise counter. Their weapon, not their life."
 ac_event_activity_contest_events_0862_aki_edge:0 "Press them with the Crimson Edge!"
 ac_event_activity_contest_events_0862_mido_body:0 "Let their attack break against my guard."
 ac_event_activity_contest_events_0862_mido_breaker:0 "Their guard cannot withstand this pressure."
 ac_event_activity_contest_events_0711_aoyu_calm:0 "Let my breath settle, and the words flow."
 ac_event_activity_contest_events_0711_aoyu_prayer:0 "I will give voice to the prayers we share."
 ac_event_activity_contest_events_0711_precognition:0 "I have glimpsed which verse will move them."
 ac_event_activity_contest_events_0711_kii_academy:0 "A disciplined mind will give this verse its shape."
 ac_event_activity_ep2_tournament_events_1003_aki_duelist:0 "Keep my footing. Recover the blade in one clean motion."
 ac_event_activity_ep2_tournament_events_1003_mido_body:0 "Make room! I will force my way back to my weapon."
 ac_event_activity_ep2_tournament_events_1007_mido_strengthen:0 "Gather close. Let me strengthen those who are flagging."
 ac_event_activity_ep2_tournament_events_1007_aki_ranks:0 "Reform the ranks. We return to the melee together."
 ac_event_activity_ep2_tournament_events_1017_aki_ranks:0 "With me! We will catch these three between us."
 ac_event_activity_ep2_tournament_events_1017_mido_breaker:0 "Stand aside. I am breaking through!"
 ac_event_activity_ep2_tournament_events_0010_aki_duelist:0 "I know this feint. Let the blade pass, then counter."
 ac_event_activity_ep2_tournament_events_0010_mido_body:0 "Brace, close the distance, and turn this into a grapple."
 ac_event_activity_ep2_tournament_events_0011_aki_duelist:0 "The other hand knows the blade just as well."
 ac_event_activity_ep2_tournament_events_0011_mido_endurance:0 "Pain cannot loosen my resolve. Change the grip and fight."
 ac_event_activity_ep2_tournament_events_4003_aki_pike:0 "That cumbersome lance leaves an opening. I will take it."
 ac_event_activity_ep2_tournament_events_4003_mido_rider:0 "A steady mount and seat will withstand this pass."
 ac_event_activity_ep2_tournament_events_4004_aki_duelist:0 "On foot? Gladly. Let us see your bladework."
 ac_event_activity_ep2_tournament_events_4004_mido_body:0 "On foot, my stance will be stronger still."
 ac_event_activity_ep2_tournament_events_4008_mido_rider:0 "Easy, now. Trust my hands, not the shouting."
 ac_event_activity_ep2_tournament_events_4008_aoyu_calm:0 "Find stillness amid the noise. Keep the horse settled."
 ac_event_activity_ep2_tournament_events_2001_mido_body:0 "Keep the dirt. My strength will break this hold."
 ac_event_activity_ep2_tournament_events_2501_mido_line:0 "Root my stance and let them tire themselves."
 ac_event_activity_ep2_tournament_events_2501_mido_body:0 "Secure a crushing body grapple."
 ac_event_activity_ep2_tournament_events_2501_mido_breaker:0 "Commit to one powerful takedown!"
 ac_event_activity_ep2_tournament_events_2502_mido_endurance:0 "Favor the sound hand. My endurance will carry me through."
 ac_event_activity_joust_iron_body:0 "Seal my stance with chi. I can safely continue."
 ac_event_activity_neck_iron_body:0 "Reinforce my neck. Break the hold before it snaps!"
 ac_event_activity_contest_events_5000_aoyu_mirror:0 "Their insults will find only a composed reply."
 ac_event_activity_contest_events_5000_kii_academy:0 "Answer with a learned verse sharper than any insult."
 ac_event_activity_contest_events_5020_aoyu_prayer:0 "Let the encore speak to their deepest hopes."
 ac_event_activity_contest_events_5020_kii_academy:0 "One polished encore, drawn from a well-trained memory."
 ac_event_activity_contest_events_5030_aoyu_calm:0 "Breathe. Begin the next verse with a steadier voice."
 ac_event_activity_contest_events_5030_kii_academy:0 "Rework the meter. I can still save this composition."
 ac_event_activity_ep2_tournament_events_5501_aoyu_calm:0 "The words may be alike. My delivery will make them mine."
 ac_event_activity_ep2_tournament_events_5501_kii_academy:0 "I have studied enough verse to compose another."
 ac_event_activity_ep2_tournament_events_5503_aoyu_calm:0 "Let the Calming Current restore my voice."
 ac_event_activity_ep2_tournament_events_5503_kii_academy:0 "Recall the practiced opening. The rest will follow."
 ac_event_activity_ep2_tournament_events_5504_aoyu_calm:0 "Thunder will not shake my composure."
 ac_event_activity_ep2_tournament_events_5504_kiihakai_barrier:0 "A barrier over the dais will keep this recital going."
 ac_event_activity_final_lap_mido_rider:0 "[jockey.GetFirstNameNoTooltip], use Beast Riders to find the opening!"
 ac_event_activity_final_lap_precognition:0 "[jockey.GetFirstNameNoTooltip], follow the line you have foreseen!"
 ac_event_activity_final_lap_kiihakai_barrier:0 "[jockey.GetFirstNameNoTooltip], shield the dangerous turn with chi!"
 ac_event_activity_prepare_jockey_1_kiihakai_ward:0 "I choose [jockey1.GetFirstNameNoTooltip]. Let me ward the equipment."
 ac_event_activity_prepare_jockey_1_aoyu_calm:0 "I choose [jockey1.GetFirstNameNoTooltip]. Let me settle their nerves."
 ac_event_activity_prepare_jockey_1_mido_rider:0 "I choose [jockey1.GetFirstNameNoTooltip]. Let me coach their horse handling."
 ac_event_activity_prepare_jockey_2_kiihakai_ward:0 "I choose [jockey2.GetFirstNameNoTooltip]. Let me ward the equipment."
 ac_event_activity_prepare_jockey_2_aoyu_calm:0 "I choose [jockey2.GetFirstNameNoTooltip]. Let me settle their nerves."
 ac_event_activity_prepare_jockey_2_mido_rider:0 "I choose [jockey2.GetFirstNameNoTooltip]. Let me coach their horse handling."
 ac_event_activity_prepare_jockey_3_kiihakai_ward:0 "I choose [jockey3.GetFirstNameNoTooltip]. Let me ward the equipment."
 ac_event_activity_prepare_jockey_3_aoyu_calm:0 "I choose [jockey3.GetFirstNameNoTooltip]. Let me settle their nerves."
 ac_event_activity_prepare_jockey_3_mido_rider:0 "I choose [jockey3.GetFirstNameNoTooltip]. Let me coach their horse handling."
 ac_event_activity_jason_first_race_event_1_mido_rider:0 "Steady hands and a familiar voice will restore control."
 ac_event_activity_jason_first_race_event_1_aoyu_calm:0 "Breathe slowly. Let horse and rider settle together."
 ac_event_activity_collision_barrier:0 "Keep the stricken pair safe behind my barrier."
 ac_event_activity_contest_events_3010_mido_rider:0 "Steady hands and a familiar voice will restore control."
 ac_event_activity_contest_events_3010_aoyu_calm:0 "Breathe slowly. Let horse and rider settle together."
 ac_event_activity_jockey_mending:0 "Bring the jockey here. Mending Chi will close those wounds."
 ac_event_activity_hunt_tracks:0 "Chi will show which tracks are fresh. Follow this trail."
 ac_event_activity_pit_fall_rescue:0 "Cushion the fall, then lift myself out on the wind."
 ac_event_activity_pit_rubble:0 "Shape footholds in the earth and climb out."
 ac_event_activity_pit_mido_body:0 "An Iron Body can survive the landing and climb back out."
 ac_event_activity_child_breathing:0 "Breathe with me. Steady the bow, then release."
 ac_event_activity_stare_mido_subdue:0 "Be still. There is no prey for you here."
 ac_event_activity_stare_aoyu_calm:0 "Still my breathing. Withdraw without alarming the beast."
 ac_event_activity_fans_aoyu_calm:0 "Calm yourselves. This contest is no cause for bloodshed."
 ac_event_activity_fans_bind_looters:0 "Bind their hands until tempers cool."
 ac_event_activity_fans_kiihakai_barrier:0 "A barrier between them will end this brawl."
 ac_event_activity_pilgrim_overboard_water_rescue:0 "The waves will return our companion to us."
 ac_event_activity_pilgrim_overboard_aoyu_calm:0 "Keep calm. We will organize the rescue together."
 ac_event_activity_pilgrim_sickness:0 "A tested remedy will carry me through this sickness."
 ac_event_activity_ritual_water:0 "Make room in the sacred waters. I will guide the current."
 ac_event_activity_ritual_aoyu_prayer:0 "Let us pray and cleanse ourselves together, high and low alike."
 ac_event_activity_pilgrim_ambush_precognition:0 "I saw this ambush. We will leave by the path you failed to watch."
 ac_event_activity_pilgrim_ambush_aoyusumu_exorcism:0 "I will answer your threats with the Exorcist's Rite."
 ac_event_activity_feast_runes:0 "Fetch materials. I will restore the damaged runes myself."
 ac_event_activity_murder_feast_precognition:0 "I saw this betrayal. The escape route is already clear."
 ac_event_activity_murder_feast_shadow_escape:0 "A shadow slips between the closing doors."
 ac_event_activity_murder_feast_kiihakai_barrier:0 "Hold their blades behind a barrier while I escape!"
